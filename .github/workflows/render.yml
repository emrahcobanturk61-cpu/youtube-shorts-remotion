name: Render Shorts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render.yml"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Videoları üret
        run: |
          npx remotion render src/index.ts EgitimVideoShorts out/egitim-shorts.mp4
          npx remotion render src/index.ts OrnekVideo out/ornek-video.mp4

      - name: Çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: shorts-videolari
          path: out/*.mp4
          retention-days: 14
